<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&family=Rubik:wght@900&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;background:transparent}
  #s{position:relative;width:1800px;height:1100px}
  .lock{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-9deg) skewX(-6deg);
    display:flex;align-items:center;gap:6px;font-family:Cairo,sans-serif;color:#003366}
  .txt{display:flex;flex-direction:column;align-items:flex-start;line-height:.95}
  .kicker{font-weight:900;font-size:58px;color:#e5162b;letter-spacing:4px;margin-bottom:6px}
  .l1{font-weight:900;font-size:120px}
  .l1 b,.l2 b{font-family:Rubik,sans-serif;font-weight:900}
  .l2{font-weight:900;font-size:150px;white-space:nowrap;margin-top:-10px}
  .two{position:relative;font-family:Rubik,sans-serif;font-weight:900;font-size:420px;line-height:.78;color:#003366;margin-right:-6px}
  .ribbon{position:absolute;left:-40px;bottom:10px;transform:rotate(-2deg);display:flex;align-items:center}
  .ribbon .band{background:linear-gradient(180deg,#ff3b3b,#d40f1f);color:#fff;font-family:Cairo,sans-serif;font-weight:900;
    font-size:74px;line-height:1;padding:6px 46px 16px 54px;clip-path:polygon(9% 0,100% 0,100% 100%,9% 100%,0 50%);
    box-shadow:0 6px 0 #8a0712}
  .ribbon .fold{width:30px;height:100%;}
  .rule{position:absolute;height:9px;border-radius:5px}
  .rule.top{background:#003366;width:300px;left:150px;top:-40px}
  .rule.bot{background:#fff;width:300px;right:40px;bottom:-60px;box-shadow:0 0 0 1px rgba(0,0,0,.05)}
</style></head><body>
<div id="s"><div class="lock">
  <i class="rule top"></i>
  <div class="txt">
    <div class="kicker">عـرض خــاص</div>
    <div class="l1">اشترِ <b>2</b></div>
    <div class="l2">واحصل على</div>
  </div>
  <div class="two">2<div class="ribbon"><div class="band">مجاناً</div></div></div>
  <i class="rule bot"></i>
</div></div></body></html>
